<style>
  :root{--gold:#d4af5a;--gold2:#f3d98b;--bg:#0b0b0b;--text:#f5f2ea;--muted:#a9a397}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:'Montserrat',system-ui,sans-serif;
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 22px calc(28px + env(safe-area-inset-bottom));text-align:center;overflow-x:hidden;
    background-image:radial-gradient(circle at 50% -10%,rgba(212,175,90,.28),transparent 55%),

  .wrap{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:22px}
  .crown{width:64px;height:64px}
  .brand{font-weight:800;letter-spacing:.18em;font-size:15px;color:var(--gold2)}
  .brand small{display:block;margin-top:6px;font-weight:600;letter-spacing:.32em;font-size:11px;color:var(--muted)}
  h1{font-size:30px;line-height:1.15;font-weight:800}
  h1 span{color:var(--gold)}
  p.lead{font-size:16px;line-height:1.5;color:var(--muted);font-weight:500}
  .list{list-style:none;display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
  .list li{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.04);
    border:1px solid rgba(212,175,90,.22);border-radius:14px;padding:13px 16px;font-size:15px;font-weight:600}
  .list li b{color:var(--gold);font-size:18px}
  .btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
    background:#25D366;color:#06210f;text-decoration:none;font-weight:800;font-size:18px;
    padding:20px 18px;border-radius:18px;box-shadow:0 10px 30px rgba(37,211,102,.35);
    animation:pulse 2s infinite;-webkit-tap-highlight-color:transparent;border:0;cursor:pointer;font-family:inherit}
  .btn svg{width:26px;height:26px;flex:none}
  .note{font-size:13px;color:var(--muted)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

<script>
  document.getElementById('wa').addEventListener('click', function () {
    var url = 'https://wa.me/' + WA_PHONE + '?text=' + encodeURIComponent(WA_TEXT);
    try { ttq.track('Contact', { content_name: 'whatsapp_button' }); } catch (e) {}
    setTimeout(function () { window.location.href = url; }, 300);
  });
</script>
